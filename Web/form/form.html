<!-- exw3form.html -->
<!DOCTYPE html>
<html>

<head>
    <title>W3.CSS Registration Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Luckiest+Guy|Kanit">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="w3.css">
    <link rel="icon" type="image/x-icon" href="icon.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            margin: 40px;
            background-color: #fcfbfa;
            font-family: Kanit,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;

        }
        .box {
            background: linear-gradient(to top, #fff3cd 0%, #fffdf4 100%);
            border-radius: 15px;
            border: 1.5px solid #f2e3c6;
            padding: 35px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 15px 35px rgba(211, 84, 0, 0.18);
        }

        .h2 {
            font-family: 'Luckiest Guy', 'Kanit', sans-serif;
            letter-spacing: 1.5px;
            color: #e67e22;
            text-align: center;
        }

        .w3-input, .w3-select, textarea {
            border-radius: 8px !important;
            border: 1px solid #dcd6cd !important;
            background-color: #ffffff;
        }
        
        .w3-input:focus, .w3-select:focus, textarea:focus {
            border-color: #f39c12 !important;
            box-shadow: 0 0 5px rgba(243, 156, 18, 0.3);
        }
    </style>
</head>

<body>

    <form class="w3-container w3-card-4 box" action="/action_page.php" method="POST" enctype="multipart/form-data">
        <h2 class="h2">REGISTRATION FORM</h2>
        <hr style="border: 0; height: 2px; background: #f39c12; opacity: 0.5;">
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>First Name * : </b></label>
            <input class="w3-input w3-border" name="first" type="text" required>
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>Last Name * :</b></label>
            <input class="w3-input w3-border" name="last" type="text" required>
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>📧 Email * :</b></label>
            <input class="w3-input w3-border" name="mail" type="email" required>
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>📞 Tel :</b></label>
            <input class="w3-input w3-border" name="tel" type="tel" placeholder="097-xxxxxxx">
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>Gender :</b></label><br>
            <input type="radio" id="gender1" name="gender" value="Male" class="w3-radio">
            <label for="gender1">Male</label>&nbsp;&nbsp;&nbsp;
            <input type="radio" id="gender2" name="gender" value="Female" class="w3-radio">
            <label for="gender2">Female</label>&nbsp;&nbsp;&nbsp;
            <input type="radio" id="gender0" name="gender" value="NA" class="w3-radio" checked>
            <label for="gender0">NA</label>
        </p>
        
        <p>
            <label for="dob" class="w3-text-blue" style="color: #2c3e50 !important;"><b>📅 Birth Date * :</b></label>
            <input type="date" id="dob" name="dob" class="w3-input w3-border" required>
        </p>
        
        <p>
            <label for="faculty" class="w3-text-blue" style="color: #2c3e50 !important;"><b>🎓 Faculty * :</b></label>
            <select name="faculty" id="faculty" class="w3-select w3-border" required>
                <option value="" selected>--------- select of faculty ---------</option>
                <option value="01">Education</option>
                <option value="02">Humanities and Social Sciences</option>
                <option value="03">Science and Technology</option>
                <option value="04">Fine and Applied Arts</option>
                <option value="05">Communication Sciences</option>
                <option value="06">Islamic Sciences</option>
                <option value="07">Political Science</option>
                <option value="08">Faculty of Nursing</option>
            </select><br>
        </p>
        
        <p>
            <label for="sop" class="w3-text-blue" style="color: #2c3e50 !important;"><b>Statement of Purpose :</b></label><br>
            <textarea name="sop" id="sop" class="w3-input w3-border" rows="4"></textarea>
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>💼 Job title & Position :</b> (select more than one)</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Full-stack" checked="checked">
            <label> Full-stack developer</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Back-end">
            <label> Back-end developer</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Front-end">
            <label> Front-end developer</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Data Scientist">
            <label> Data Scientist</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="System analyst">
            <label> System analyst</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Researcher">
            <label> Researcher</label><br>
            <input class="w3-check" type="checkbox" name="job[]" value="Teacher">
            <label> Teacher</label><br>
        </p>
        
        <p>
            <label class="w3-text-blue" style="color: #2c3e50 !important;"><b>⭐ Satisfaction Level with Teaching & Learning (1-10) :</b></label><br>
            <input type="range" id="vol" name="vol" min="0" max="10" value="5" style="width: 85%; vertical-align: middle;" oninput="this.nextElementSibling.value = this.value">
            <output style="font-family: kanit; color: #2c3e50; font-size: 16px; font-weight: bold; margin-left: 10px;">5</output>
        </p>
        
        <p>
            <label for="myfile" class="w3-text-blue" style="color: #2c3e50 !important;"><b>📂 Select a file :</b></label>
            <input type="file" id="myfile" name="myfile" class="w3-input w3-border" style="background: #ffffff;"><br>
        </p>
        
        <p class="w3-center" style="margin-top: 35px;">
            <button type="submit" class="w3-btn w3-round" style="background-color: #e67e22; color: white; font-weight: bold; padding: 8px 20px;">Register</button>
            <button type="reset" class="w3-btn w3-round" style="background-color: #f39c12; color: white; font-weight: bold; padding: 8px 20px; margin: 0 8px;">Reset</button>
            <button type="button" class="w3-btn w3-round" style="background-color: #bdc3c7; color: #2c3e50; font-weight: bold; padding: 8px 20px;" onclick="window.history.back();">Close</button>
        </p>
    </form>

</body>

</html>
