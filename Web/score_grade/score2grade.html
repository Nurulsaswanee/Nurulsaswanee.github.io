<!DOCTYPE html>
<html>

<head>
    <title>Score Grade</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="psu_logo.webp">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <script src="dataController.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 30px 20px;
        }

        .main-wrapper {
            max-width: 950px;
            margin: 0 auto;
        }

        /* กรอบการ์ดโทนสว่าง */
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
        }

        h2, h3 {
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* ตกแต่งฟอร์ม */
        label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            max-width: 380px;
            padding: 9px 12px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #1e293b;
            box-sizing: border-box;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input[type="text"][readonly] {
            background-color: #f1f5f9;
            cursor: not-allowed;
            color: #64748b;
        }

        /* ปุ่มกด */
        .btn-submit {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 6px;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        /* ตกแต่งตาราง */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 10px;
        }

        td {
            border-bottom: 1px solid #f1f5f9;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #334155;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge-avg {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-action {
            cursor: pointer;
            margin: 0 3px;
            padding: 4px 10px;
            border-radius: 5px;
            color: white;
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-del {
            background-color: #ef4444;
        }

        .btn-edit {
            background-color: #3b82f6;
        }

        /* กราฟ */
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .chart-box {
            flex: 1;
            min-width: 300px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #b2bec3;
            line-height: 1.4;
        }
    </style>
    <script>
        let barChartInstance = null;
        let pieChartInstance = null;

        function calculateGrade(score) {
            if (score >= 80) return "A";
            if (score >= 70) return "B";
            if (score >= 60) return "C";
            if (score >= 50) return "D";
            return "F";
        }

        function clearForm() {
            document.getElementById("stid").value = "";
            document.getElementById("sname").value = "";
            document.getElementById("mid").value = "";
            document.getElementById("fin").value = "";
            document.getElementById("stid").readOnly = false;
            document.getElementById("btnAdd").value = "Add";
        }

        function addScore() {
            let stid = document.getElementById("stid").value.trim();
            let sname = document.getElementById("sname").value.trim();
            let midVal = document.getElementById("mid").value.trim();
            let finVal = document.getElementById("fin").value.trim();

            if (stid === "" || sname === "" || midVal === "" || finVal === "") {
                alert("Please fill in all required fields.");
                return;
            }

            let mid = parseFloat(midVal);
            let fin = parseFloat(finVal);

            if (isNaN(mid) || isNaN(fin)) {
                alert("Scores must be valid numbers.");
                return;
            }

            if (mid < 0 || mid > 50) {
                alert("Midterm score must be between 0 and 50.");
                document.getElementById("mid").focus();
                return;
            }
            if (fin < 0 || fin > 50) {
                alert("Final score must be between 0 and 50.");
                document.getElementById("fin").focus();
                return;
            }

            let isEditMode = document.getElementById("stid").readOnly;

            if (!isEditMode && getStudentByID(stid) != -1) {
                alert("Duplicate Student ID! This ID already exists.");
                return;
            }

            let tot = mid + fin;
            let grd = calculateGrade(tot);
            let dat = { "stid": stid, "name": sname, "mid": mid, "fin": fin, "tot": tot, "grd": grd };

            if (isEditMode) {
                updateStudent(dat);
            } else {
                addStudent(dat);
            }

            clearForm();
            showResult();
        }

        function delStudent(stid) {
            const isConfirmed = confirm("Are you sure you want to delete this student record?");
            if (isConfirmed) {
                delStudentByID(stid);
                showResult();
            }
        }

        function editStudent(stid) {
            let student = getStudentByID(stid);
            if (student == -1 || !student) return;

            document.getElementById("stid").value = student.stid;
            document.getElementById("stid").readOnly = true;
            document.getElementById("sname").value = student.name;
            document.getElementById("mid").value = student.mid;
            document.getElementById("fin").value = student.fin;

            document.getElementById("btnAdd").value = "Update";
            document.getElementById("sname").focus();
        }

        function renderCharts(gradeCounts) {
            let labels = ["A", "B", "C", "D", "F"];
            let dataValues = [
                gradeCounts["A"],
                gradeCounts["B"],
                gradeCounts["C"],
                gradeCounts["D"],
                gradeCounts["F"]
            ];
            let barColors = ["#10b981", "#3b82f6", "#f59e0b", "#f97316", "#ef4444"];

            if (barChartInstance) barChartInstance.destroy();
            if (pieChartInstance) pieChartInstance.destroy();

            // 1. Bar Chart
            let ctxBar = document.getElementById("barChart").getContext("2d");
            barChartInstance = new Chart(ctxBar, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Number of Students",
                        backgroundColor: barColors,
                        data: dataValues
                    }]
                },
                options: {
                    responsive: true,
                    legend: { display: false },
                    title: { display: true, text: "Grade Distribution (Bar Chart)", fontColor: "#334155", fontSize: 14 },
                    scales: {
                        yAxes: [{
                            ticks: {
                                beginAtZero: true,
                                stepSize: 1,
                                fontColor: "#64748b"
                            },
                            gridLines: {
                                color: "#f1f5f9"
                            }
                        }],
                        xAxes: [{
                            ticks: {
                                fontColor: "#64748b"
                            },
                            gridLines: {
                                display: false
                            }
                        }]
                    }
                }
            });

            // 2. Pie Chart
            let ctxPie = document.getElementById("pieChart").getContext("2d");
            pieChartInstance = new Chart(ctxPie, {
                type: "pie",
                data: {
                    labels: labels,
                    datasets: [{
                        backgroundColor: barColors,
                        data: dataValues
                    }]
                },
                options: {
                    responsive: true,
                    title: { display: true, text: "Grade Distribution (Pie Chart)", fontColor: "#334155", fontSize: 14 },
                    legend: {
                        labels: {
                            fontColor: "#475569"
                        }
                    }
                }
            });
        }

        function showResult() {
            let data = getAllStudents();
            let len = data.length;

            let gradeCounts = { "A": 0, "B": 0, "C": 0, "D": 0, "F": 0 };

            if (len === 0) {
                document.getElementById("rs").innerHTML = "<p style='color: #64748b; margin: 10px 0;'>No student records found.</p>";
                renderCharts(gradeCounts);
                return;
            }

            let tbl = "<div class='table-responsive'><table>";
            tbl += "<tr><th>NO</th><th>ID</th><th>NAME</th><th>Midterm (50)</th><th>Final (50)</th><th>Total (100)</th><th>Grade</th><th>Actions</th></tr>";

            let sum = 0;
            for (let i = 0; i < len; i++) {
                sum += data[i].tot;
                if (gradeCounts[data[i].grd] !== undefined) {
                    gradeCounts[data[i].grd]++;
                }

                tbl += "<tr>" +
                    "<td>" + (i + 1) + "</td>" +
                    "<td>" + data[i].stid + "</td>" +
                    "<td style='text-align: left; font-weight: 500;'>" + data[i].name + "</td>" +
                    "<td>" + data[i].mid + "</td>" +
                    "<td>" + data[i].fin + "</td>" +
                    "<td><strong>" + data[i].tot + "</strong></td>" +
                    "<td><span style='font-weight: 700; color: #1e293b;'>" + data[i].grd + "</span></td>" +
                    "<td>" +
                        "<span class='btn-action btn-del' onclick=\"delStudent('" + data[i].stid + "')\">Del</span>" +
                        "<span class='btn-action btn-edit' onclick=\"editStudent('" + data[i].stid + "')\">Edit</span>" +
                    "</td>" +
                    "</tr>";
            }
            tbl += "</table></div>";

            let avg = (sum / len).toFixed(2);
            let result = tbl + "<div class='badge-avg'>Average = " + avg + "</div>";
            document.getElementById("rs").innerHTML = result;

            renderCharts(gradeCounts);
        }

        window.onload = function() {
            showResult();
        };
    </script>
</head>

<body>
    <div class="main-wrapper">
        <!-- กรอบที่ 1: ส่วนฟอร์มบันทึกข้อมูล -->
        <div class="card">
            <h2>Student Score Form</h2>
            <form onsubmit="return false;">
                <label for="stid">Student ID:</label><br>
                <input type="text" id="stid" name="stid"><br><br>

                <label for="sname">Student name:</label><br>
                <input type="text" id="sname" name="sname"><br><br>

                <label for="mid">Midterm (Max 50):</label><br>
                <input type="number" id="mid" name="mid" min="0" max="50" placeholder="0 - 50"><br><br>

                <label for="fin">Final (Max 50):</label><br>
                <input type="number" id="fin" name="fin" min="0" max="50" placeholder="0 - 50"><br><br>

                <input type="button" id="btnAdd" class="btn-submit" value="Add" onclick="addScore()">
                <input type="button" class="btn-cancel" value="Cancel" onclick="clearForm()">
            </form>
        </div>

        <!-- กรอบที่ 2: ส่วนตารางแสดงผล -->
        <div class="card">
            <h3>Grade Table</h3>
            <div id="rs"></div>
        </div>

        <!-- กรอบที่ 3: ส่วนกราฟสถิติ -->
        <div class="chart-container">
            <div class="chart-box">
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Copyright 2026 &copy; by Nurulsaswanee Denasan <br> 6720310107</p>
    </footer>
</body>

</html>
